<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b12" />
  <title>Email confirmed | HoopLog</title>
  <style>
    :root { --bg:#070b12; --panel:rgba(255,255,255,.065); --line:rgba(255,255,255,.11); --text:#f9fafb; --muted:#9ca3af; --orange:#f97316; --orange2:#fb923c; --green:#22c55e; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      background: radial-gradient(circle at 50% 0%, rgba(249,115,22,.17), transparent 30%),
                  radial-gradient(circle at 100% 100%, rgba(249,115,22,.08), transparent 24%), var(--bg);
      color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .card { width:min(480px,100%); padding:42px 34px; text-align:center; border:1px solid var(--line); border-radius:30px; background:var(--panel); backdrop-filter:blur(18px); box-shadow:0 28px 90px rgba(0,0,0,.42); }
    .brand { font-weight:850; font-size:22px; letter-spacing:-.4px; margin-bottom:28px; }
    .brand span { color:var(--orange); }
    .ball { width:96px; height:96px; margin:0 auto 24px; border-radius:50%; position:relative; background:radial-gradient(circle at 35% 30%, #fdba74, var(--orange) 48%, #c2410c 100%); box-shadow:0 18px 42px rgba(249,115,22,.28); }
    .ball:before,.ball:after { content:""; position:absolute; inset:0; border-radius:50%; }
    .ball:before { border-left:4px solid rgba(43,20,7,.78); transform:rotate(32deg) scale(.73); }
    .ball:after { border-top:4px solid rgba(43,20,7,.78); transform:rotate(-22deg) scale(.84); }
    .badge { width:36px; height:36px; margin:-46px auto 20px; margin-left:calc(50% + 23px); border-radius:50%; display:grid; place-items:center; background:var(--green); border:4px solid #111827; font-weight:900; }
    h1 { margin:0 0 12px; font-size:34px; letter-spacing:-1px; }
    p { margin:0 auto; max-width:380px; color:var(--muted); font-size:16px; line-height:1.65; }
    .button { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:30px; padding:16px 22px; border-radius:15px; color:white; text-decoration:none; font-weight:800; background:linear-gradient(135deg,var(--orange2),var(--orange)); box-shadow:0 14px 34px rgba(249,115,22,.25); transition:transform .18s ease; }
    .button:hover { transform:translateY(-1px); }
    .hint { margin-top:20px; font-size:13px; color:#6b7280; }
    .divider { height:1px; background:var(--line); margin:28px 0 20px; }
    .status { display:inline-flex; gap:8px; align-items:center; padding:7px 11px; border-radius:999px; background:rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.24); color:#86efac; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.09em; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Hoop<span>Log</span></div>
    <div class="ball" aria-hidden="true"></div>
    <div class="badge" aria-hidden="true">✓</div>
    <div class="status">✓ Verified</div>
    <h1>Email confirmed!</h1>
    <p>Your email address has been verified successfully. Your HoopLog account is ready to use.</p>
    <a class="button" href="hooplog://home">Open HoopLog <span aria-hidden="true">→</span></a>
    <div class="divider"></div>
    <p class="hint">You can safely close this page and return to the HoopLog mobile app.</p>
  </main>
</body>
</html>
